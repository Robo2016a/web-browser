<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="browser-container">
      <header class="toolbar">
        <div class="nav-buttons">
          <button class="icon-button" id="backBtn" title="Back" aria-label="Back">‹</button>
          <button class="icon-button" id="forwardBtn" title="Forward" aria-label="Forward">›</button>
          <button class="icon-button" id="reloadBtn" title="Reload" aria-label="Reload">↻</button>
        </div>

        <div class="address-shell">
          <span id="securityIcon" class="security-icon">🔒</span>
          <input id="addressBar" autocomplete="off" spellcheck="false" placeholder="Search Google or type a URL" />
          <button id="clearBtn" class="clear-button" aria-label="Clear address" hidden>×</button>
        </div>

        <div class="toolbar-actions">
          <button id="accountBtn" class="account-button" title="Google accounts" aria-label="Google accounts">●</button>
          <button id="menuBtn" class="icon-button" title="Menu" aria-label="Menu">⋮</button>
        </div>
      </header>

      <section class="account-panel" id="accountPanel" hidden>
        <div class="panel-title">Google accounts</div>
        <p class="panel-note">Sign in or switch accounts on Google itself. Account sessions are kept by this local Electron profile.</p>
        <button id="openAccountsBtn" class="panel-action">Open Google account chooser</button>
      </section>

      <div id="loadingBar" class="loading-bar"></div>
      <section class="page-container">
        <webview id="browserView" src="https://www.google.com/" partition="persist:browser" allowpopups></webview>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
